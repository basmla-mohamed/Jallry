<!--nav bar-->
<nav class="navbar navbar-expand-lg py-3" [class.dark-theme]="isDarkMode">
  <div class="container">
    <a class="navbar-brand d-flex flex-row column-gap-3 fw-bold" href="#">
      <img src="assets/logo.png" class="img-fluid" alt="" />
      <p class="mb-0">VIZORA</p>
    </a>

    <button class="theme-btn" (click)="toggleTheme()">
      <i class="fa-solid" [class.fa-moon]="!isDarkMode" [class.fa-sun]="isDarkMode"></i>
    </button>
  </div>
</nav>

<!--gallery-->
<div id="Gallery" [class.dark-theme]="isDarkMode">
  <div class="container">
    <div class="title">
      <span>THE ART OF VISUALS — 2026</span>
      <h1>Explore The <span>Extraordinary.</span></h1>
      <p>A curated collection of beautiful visuals, creative ideas and inspiring moments.</p>
      <a href="#galleryBody">
        <i class="fa-solid fa-angles-down"></i>
      </a>
    </div>
    <div class="categories">
      <button
        *ngFor="let category of categories"
        [class.active]="selectedCategory === category"
        (click)="filterImages(category)"
      >
        {{ category }}
      </button>
    </div>
    <div class="gallery-view">
      <button [class.active]="isGridView" (click)="toggleView(true)">
        <i class="fa-solid fa-grip"></i>
      </button>

      <button [class.active]="!isGridView" (click)="toggleView(false)">
        <i class="fa-solid fa-list"></i>
      </button>
    </div>
    <div id="galleryBody">
      <div class="row" [class.list-view]="!isGridView">
        <div
          class="col-lg-4 col-md-6 mb-4"
          [class.col-12]="!isGridView"
          *ngFor="let img of filteredImages"
        >
          <div class="item rounded-4 overflow-hidden">
            <img [src]="'assets/' + img.src" class="img-fluid" />

            <div class="layout">
              <div class="image-info">
                <span>{{ img.category }}</span>
                <h3>{{ img.name }}</h3>
              </div>

              <i class="fa-solid fa-expand" (click)="openPopup(img)"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!--popup-->
<div
  id="popup"
  [class.active]="isPopupActive"
  (click)="closePopup()"
  [class.dark-theme]="isDarkMode"
>
  <div class="box" (click)="$event.stopPropagation()">
    <i class="fa-solid fa-arrow-right-from-bracket close" (click)="closePopup()"> </i>

    <img [src]="'assets/' + selectedImage.src" class="img-fluid" />

    <i class="fa-regular fa-hand-point-right right" (click)="nextImage()"></i>
    <i class="fa-regular fa-hand-point-left left" (click)="prevImage()"></i>

    <ul class="list-unstyled d-flex flex-row">
      <li
        *ngFor="let img of filteredImages; index as i"
        [class.active]="currentIndex === i"
        (click)="showImage(i)"
      >
        {{ i + 1 }}
      </li>
    </ul>
  </div>
</div>

<!-- [class.active]="isPopupActive" means angular add class active if isPopupActive if i was true -->
